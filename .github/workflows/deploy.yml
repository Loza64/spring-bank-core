name: Test, Build and Push

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Create .env for testing
        run: |
          cat <<EOF > .env
          SERVER_PORT=3400
          SPRING_APPLICATION_NAME=spring-app
          SPRING_DATASOURCE_URL=${{ secrets.SUPABASE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SUPABASE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SUPABASE_PASS }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
          SPRING_JPA_HIBERNATE_DDL_AUTO=update
          SPRING_JPA_SHOW_SQL=false
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          SECURITY_JWT_SECRET_KEY=${{ secrets.SECURITY_JWT_SECRET_KEY }}
          SECURITY_JWT_EXPIRATION_TIME=86400000
          SUPER_ADMIN_USERNAME=${{ secrets.SUPER_ADMIN_USERNAME }}
          SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
          EOF

      - name: Build and run container natively
        run: |
          docker build -t spring-app-test .
          docker run -d --name spring-app-test --env-file .env -p 3400:3400 spring-app-test

      - name: Wait and check health
        run: sleep 15 && curl --fail http://localhost:3400/actuator/health || (docker logs spring-app-test && exit 1)

      - name: Tear down
        if: always()
        run: docker rm -f spring-app-test || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

